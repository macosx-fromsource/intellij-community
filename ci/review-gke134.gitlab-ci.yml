# GKE 1.34
build_review_gke134:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_GKE134

create_review_gke134:
  extends: .create_review_template
  environment: &environment_gke134
    name: &env_gke_name134 operator134_review/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_GKE134
    on_stop: stop_review_gke134
    auto_stop_in: 1 hour
  needs:
    - build_review_gke134

review_gke134:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_GKE134
    AGENT_NAME: operator134-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  needs:
    - create_review_gke134
    # we need build_* dependency to receive appropriate artifacts
    - build_review_gke134
  environment: *environment_gke134
  resource_group: *env_gke_name134

qa_gke134:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_GKE134
  needs:
    - review_gke134

qa_gke134_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against GKE 1.31'

qa_gke134_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_GKE134
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_gke134
    - qa_gke134_full_suite_trigger

stop_review_gke134:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_GKE134
    AGENT_NAME: operator134-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  environment:
    name: *env_gke_name134
    action: stop
  needs:
    - build_review_gke134
