build_review_vcluster130:
  extends: .build_review_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER130}
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.build_review_template, rules]

create_review_vcluster130:
  extends: .create_review_template
  environment: &environment_vc130
    name: &env_vc_name130 ${VCLUSTER_ENVIRONMENT_PREFIX}review_vcluster130/$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_VCLUSTER130
    on_stop: stop_review_vcluster130
    auto_stop_in: 1 hour
  needs:
    - build_review_vcluster130
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.create_review_template, rules]

review_vcluster130:
  extends:
    - .review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER130}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_MINOR_VERSION: "30"
  environment: *environment_vc130
  resource_group: *env_vc_name130
  needs:
    - create_review_vcluster130
    # we need build_* dependency to receive appropriate artifacts
    - build_review_vcluster130
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.review_template, rules]

stop_review_vcluster130:
  extends: .stop_review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER130}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_MINOR_VERSION: "30"
  environment:
    name: *env_vc_name130
    action: stop
  needs:
    - build_review_vcluster130
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.stop_review_template, rules]
