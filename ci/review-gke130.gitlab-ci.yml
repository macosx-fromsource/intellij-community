# GKE 1.30
build_review_gke130:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_GKE130

create_review_gke130:
  extends: .create_review_template
  environment: &environment_gke130
    name: &env_gke_name130 operator130_review/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_GKE130
    on_stop: stop_review_gke130
    auto_stop_in: 1 hour
  needs:
    - build_review_gke130

review_gke130:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_GKE130
    AGENT_NAME: operator130-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  needs:
    - create_review_gke130
    # we need build_* dependency to receive appropriate artifacts
    - build_review_gke130
  environment: *environment_gke130
  resource_group: *env_gke_name130

qa_gke130:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_GKE130
  needs:
    - review_gke130

qa_gke130_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against GKE 1.30'

qa_gke130_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_GKE130
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_gke130
    - qa_gke130_full_suite_trigger

stop_review_gke130:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_GKE130
    AGENT_NAME: operator130-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  environment:
    name: *env_gke_name130
    action: stop
  needs:
    - build_review_gke130
