build_review_4_17:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_17
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
  dependencies:
    - image_certification

create_review_4_17:
  extends: .create_review_template
  environment: &environment_4_17
    name: &env_4_17_name openshift_4_17/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_OPENSHIFT_4_17
    on_stop: stop_review_openshift_4_17
    auto_stop_in: 1 hour
  needs:
    - build_review_4_17

review_4_17:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_17
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
  before_script:
    - export KUBECONFIG="$KUBECONFIG_OCP_4_17"
  needs:
    - create_review_4_17
    # we need build_* dependency to receive appropriate artifacts
    - build_review_4_17
  environment: *environment_4_17
  resource_group: *env_4_17_name

qa_4_17:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_17
  needs:
    - review_4_17

qa_4_17_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against OpenShift 4.17'

qa_4_17_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_17
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_4_17
    - qa_4_17_full_suite_trigger

stop_review_openshift_4_17:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_17
  before_script:
    - export KUBECONFIG="$KUBECONFIG_OCP_4_17"
  environment:
    name: *env_4_17_name
    action: stop
  needs:
    - build_review_4_17
