build_review_4_19:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_19
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
  dependencies:
    - image_certification

create_review_4_19:
  extends: .create_review_template
  environment: &environment_4_19
    name: &env_4_19_name openshift_4_19/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_OPENSHIFT_4_19
    on_stop: stop_review_openshift_4_19
    auto_stop_in: 1 hour
  needs:
    - build_review_4_19

review_4_19:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_19
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
    AGENT_NAME: ocp419-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    OPENSHIFT_DEPLOYMENT: true
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  needs:
    - create_review_4_19
    # we need build_* dependency to receive appropriate artifacts
    - build_review_4_19
  environment: *environment_4_19
  resource_group: *env_4_19_name

qa_4_19:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_19
  needs:
    - review_4_19

qa_4_19_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against OpenShift 4.19'

qa_4_19_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_19
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_4_19
    - qa_4_19_full_suite_trigger

stop_review_openshift_4_19:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_19
    AGENT_NAME: ocp419-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  environment:
    name: *env_4_19_name
    action: stop
  needs:
    - build_review_4_19
