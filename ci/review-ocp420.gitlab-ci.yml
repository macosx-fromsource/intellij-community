build_review_4_20:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_20
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
  dependencies:
    - image_certification

create_review_4_20:
  extends: .create_review_template
  environment: &environment_4_20
    name: &env_4_20_name openshift_4_20/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_OPENSHIFT_4_20
    on_stop: stop_review_openshift_4_20
    auto_stop_in: 1 hour
  needs:
    - build_review_4_20

review_4_20:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_20
    TEST_CR_FILES_DIR: "config/test/overlays/k8s_1_25"
    AGENT_NAME: ocp420-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    OPENSHIFT_DEPLOYMENT: true
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  needs:
    - create_review_4_20
    # we need build_* dependency to receive appropriate artifacts
    - build_review_4_20
  environment: *environment_4_20
  resource_group: *env_4_20_name

qa_4_20:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_20
  needs:
    - review_4_20

qa_4_20_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against OpenShift 4.20'

qa_4_20_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_20
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_4_20
    - qa_4_20_full_suite_trigger

stop_review_openshift_4_20:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_OPENSHIFT_4_20
    AGENT_NAME: ocp420-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  environment:
    name: *env_4_20_name
    action: stop
  needs:
    - build_review_4_20
