# GKE 1.27
build_review_gke127:
  extends: .build_review_template
  variables:
    DOMAIN: $DOMAIN_GKE127

create_review_gke127:
  extends: .create_review_template
  environment: &environment_gke127
    name: &env_gke_name127 operator127_review/$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_GKE127
    on_stop: stop_review_gke127
    auto_stop_in: 1 hour
  needs:
    - build_review_gke127

review_gke127:
  extends: .review_template
  variables:
    DOMAIN: $DOMAIN_GKE127
    AGENT_NAME: operator127-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  needs:
    - create_review_gke127
    # we need build_* dependency to receive appropriate artifacts
    - build_review_gke127
  environment: *environment_gke127
  resource_group: *env_gke_name127

# QA GKE 1.27
qa_gke127:
  extends: .qa
  stage: qa
  variables:
    DOMAIN: $DOMAIN_GKE127
  needs:
    - review_gke127

qa_gke127_full_suite_trigger:
  extends: .qa_full_suite_trigger
  script: echo 'The job will trigger Full E2E suite against GKE 1.27'

qa_gke127_full:
  extends: .qa
  stage: qa
  parallel: 7
  variables:
    DOMAIN: $DOMAIN_GKE127
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  needs:
    - review_gke127
    - qa_gke127_full_suite_trigger

stop_review_gke127:
  extends: .stop_review_template
  variables:
    DOMAIN: $DOMAIN_GKE127
    AGENT_NAME: operator127-ci-cluster
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $AGENT_PROJECT_PATH:$AGENT_NAME
    - kubectl config set-context --current --namespace=$TESTS_NAMESPACE
  environment:
    name: *env_gke_name127
    action: stop
  needs:
    - build_review_gke127
