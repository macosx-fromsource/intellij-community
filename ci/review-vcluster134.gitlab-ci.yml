build_review_vcluster134:
  extends: .build_review_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER134}
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.build_review_template, rules]

create_review_vcluster134:
  extends: .create_review_template
  environment: &environment_vc134
    name: &env_vc_name134 ${VCLUSTER_ENVIRONMENT_PREFIX}review_vcluster134/$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_VCLUSTER134
    on_stop: stop_review_vcluster134
    auto_stop_in: 1 hour
  needs:
    - build_review_vcluster134
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.create_review_template, rules]

review_vcluster134:
  extends:
    - .review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER134}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_VERSION: "v1.34.0"
  environment: *environment_vc134
  resource_group: *env_vc_name134
  needs:
    - create_review_vcluster134
    # we need build_* dependency to receive appropriate artifacts
    - build_review_vcluster134
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.review_template, rules]

stop_review_vcluster134:
  extends: .stop_review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER134}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_VERSION: "v1.34.0"
  environment:
    name: *env_vc_name134
    action: stop
  needs:
    - build_review_vcluster134
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.stop_review_template, rules]
