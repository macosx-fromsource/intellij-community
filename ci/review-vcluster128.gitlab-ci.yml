build_review_vcluster128:
  extends: .build_review_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER128}
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.build_review_template, rules]

create_review_vcluster128:
  extends: .create_review_template
  environment: &environment_vc128
    name: &env_vc_name128 ${VCLUSTER_ENVIRONMENT_PREFIX}review_vcluster128/$CI_COMMIT_SHORT_SHA$ENVIRONMENT_SUFFIX-$CI_COMMIT_REF_SLUG
    url: https://gitlab-$TESTS_NAMESPACE.$DOMAIN_VCLUSTER128
    on_stop: stop_review_vcluster128
    auto_stop_in: 1 hour
  needs:
    - build_review_vcluster128
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.create_review_template, rules]

review_vcluster128:
  extends:
    - .review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER128}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_MINOR_VERSION: "28"
  environment: *environment_vc128
  resource_group: *env_vc_name128
  needs:
    - create_review_vcluster128
    # we need build_* dependency to receive appropriate artifacts
    - build_review_vcluster128
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.review_template, rules]

stop_review_vcluster128:
  extends: .stop_review_vcluster_template
  variables:
    DOMAIN: ${DOMAIN_VCLUSTER128}
    AGENT_NAME: ${VCLUSTER_AGENT_NAME}
    AGENT_PROJECT_PATH: gitlab-org/distribution/infrastructure/kube-agents
    VCLUSTER_K8S_MINOR_VERSION: "28"
  environment:
    name: *env_vc_name128
    action: stop
  needs:
    - build_review_vcluster128
  rules:
    - !reference [.skip_if_dev_mirror]
    - !reference [.stop_review_template, rules]
