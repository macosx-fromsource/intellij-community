# Taskfile to be used with `task` binary.
# Usage:
# - List available tasks with: `task --list`
# - Run task with: `task build_chart`
# Documentation: https://taskfile.dev

version: '3'

env:

  # Binaries
  HELM: helm
  KUSTOMIZE: kubectl kustomize
  KUBECTL: kubectl
  CONTAINER_CLI: podman

  # Dependencies

  ## Cert Manager
  # https://cert-manager.io/docs/installation/#default-static-install
  CERTMANAGER_VERSION: 1.19.2

  ## Metrics Server
  # https://github.com/kubernetes-sigs/metrics-server#installation
  METRICS_SERVER_MANIFEST: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

  ## Envoy Gateway
  ENVOY_GATEWAY_VERSION: 1.6.1

  # Directories
  BUILD_DIR: .build
  INSTALL_DIR: .install

  # Image configuration
  IMG_REGISTRY: registry.gitlab.com
  IMG_REPOSITORY: gitlab-org/cloud-native
  IMG_NAME: gitlab-operator
  TAG: latest

  # Build and deploy configuration
  NAME_OVERRIDE: gitlab
  NAMESPACE: gitlab-system
  # CLUSTER_MODE controls the operator's watch scope and the scope and RBAC permissions.
  CLUSTER_MODE: "true"
  DOMAIN: example.com
  HOSTSUFFIX: ""
  TLS_SECRET: ""
  HELM_CHARTS: "{{ .ROOT_DIR }}/charts"
  CHART_VERSION: { sh: if test -z "$GITLAB_CHART_VERSION" ; then head -n1 CHART_VERSIONS; else echo $GITLAB_CHART_VERSION; fi }
  VERSION: 0.2.0

  # Bundle configuration
  BUNDLE_IMG: registry.gitlab.com/gitlab-org/cloud-native/gitlab-operator-bundle
  BUNDLE_CHANNELS: --channels=$CHANNELS
  BUNDLE_DEFAULT_CHANNEL: --default-channel=$DEFAULT_CHANNEL
  BUNDLE_METADATA_OPTS: "$BUNDLE_CHANNELS $BUNDLE_DEFAULT_CHANNEL"
  BUNDLE_OPTS: --extra-service-accounts=gitlab-manager,gitlab-nginx-ingress,gitlab-app-nonroot

  # Testing configuration
  TEST_IMG: registry.gitlab.com/gitlab-org/gitlab-build-images:gitlab-operator-build-base-golang-1.20
  TEST_CR_FILES_DIR: "config/test/base"

  # Chart retrieval configuration
  CHARTS_REF: master

tasks:

  default:
    cmds:
      - task -l
    silent: true

  dependencies:
    desc: Ensures dependencies installed.
    env:
      GOBIN: { sh: pwd }
      GO111MODULE: on
    cmds:
      - |
        workdir=`pwd`
        function download() {
          set -e
          local TMP_DIR=$(mktemp -d)
          cd $TMP_DIR
          go mod init tmp
          GOBIN=$workdir GO111MODULE=on go install sigs.k8s.io/$1
          cd $workdir
          rm -rf $TMP_DIR
          unset TMP_DIR
        }
        download controller-tools/cmd/controller-gen@v0.16.5
        download controller-runtime/tools/setup-envtest@latest
    status:
      - test -f ./controller-gen
      - test -f ./setup-envtest
      - ${KUSTOMIZE} --help > /dev/null

  kubectl_template:
    desc: Template for `kubectl` commands.
    internal: true
    vars:
      ACTION: '{{ default "apply" .ACTION }}'
    requires:
      vars: [MANIFEST]
    cmds:
      - kubectl {{ .ACTION }} -f {{ .MANIFEST }}

  install_certmanager:
    desc: Installs Cert Manager from YAML manifest at given version.
    vars:
      CERTMANAGER_HELM_ARGS: ''
    cmds:
      - >-
        $HELM upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager
        --version {{ .CERTMANAGER_VERSION }}
        -n cert-manager --create-namespace
        --set crds.enabled=true
        {{ .CERTMANAGER_HELM_ARGS }}

  install_certmanager_envoy:
    cmds:
      - task: install_certmanager
        vars:
          CERTMANAGER_HELM_ARGS: '--set config.apiVersion="controller.config.cert-manager.io/v1alpha1" --set config.kind="ControllerConfiguration" --set config.enableGatewayAPI=true'

  wait_certmanager:
    desc: Waits for the rollout of the certmanager deployments.
    cmds:
      - >-
        kubectl rollout status deployment
        -n cert-manager
        -l "app.kubernetes.io/instance=cert-manager"

  uninstall_certmanager:
    desc: Uninstalls Cert Manager from YAML manifest at given version.
    cmds:
      - $HELM uninstall -n cert-manager --ignore-not-found cert-manager

  install_metrics_server:
    desc: Installs Kubernetes Metrics Server.
    cmds:
      - task: kubectl_template
        vars:
          ACTION: 'apply'
          MANIFEST: $METRICS_SERVER_MANIFEST

  uninstall_metrics_server:
    desc: Uninstalls Kubernetes Metrics Server.
    cmds:
      - task: kubectl_template
        vars:
          ACTION: 'delete'
          MANIFEST: $METRICS_SERVER_MANIFEST

  install_envoy_gateway:
    desc: Installs Envoy Gateway
    cmds:
      - >-
        $HELM upgrade --install eg oci://docker.io/envoyproxy/gateway-helm
        --version {{ .ENVOY_GATEWAY_VERSION }}
        -n envoy-gateway-system
        --create-namespace
        --set config.envoyGateway.extensionsApi.enableEnvoyPatchPolicy=true

  uninstall_envoy_gateway:
    desc: Uninstalls Envoy Gateway
    cmds:
      - $HELM uninstall eg -n envoy-gateway-system --ignore-not-found

  generate:
    desc: Generates Kubernetes API extension resources and code with `controller-gen`.
    deps:
      - dependencies
    cmds:
      - ./controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."

  manifests:
    desc: Generates manifests for CRD and webhook using `controller-gen`.
    deps:
      - dependencies
    cmds:
      - ./controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases

  install_v2alpha1_crds:
    desc: |
      Installs the apps.gitlab.com/v2alpha1 CRDs for Bridge development, and grants the manager
      ServiceAccount what the GitLabCore reconciler needs on top of the chart permissions.
      These are not part of the Helm chart, so they reach no release manifest and no OLM bundle.
      Acts on the current kubectl context.
    vars:
      DRY_RUN: '{{ default "none" .DRY_RUN }}'
    cmds:
      # Adds GitLabCore, Orbit, and DataInsightPlatform. Each is a definition of its own with
      # v2alpha1 as its only version, so the existing GitLab definition is left alone.
      - $KUBECTL apply --dry-run={{ .DRY_RUN }} -f config/crd/bases/
      # The chart grants the manager the v1beta1 GitLab permissions only, and no
      # PodDisruptionBudget permissions at all: the v1beta1 controller applies no PDB, while the
      # GitLabCore reconciler applies everything the chart renders.
      #
      # These go into a role of their own rather than into the chart-managed manager role, so that
      # `task deploy_operator` does not revert them and rerunning this task changes nothing.
      # Silent: the manifest is not worth echoing on every run.
      - cmd: |
          $KUBECTL apply --dry-run={{ .DRY_RUN }} -f - <<EOF
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: $NAME_OVERRIDE-manager-v2alpha1-role
          rules:
          - apiGroups: [apps.gitlab.com]
            resources: [gitlabcores]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [apps.gitlab.com]
            resources: [gitlabcores/status]
            verbs: [get, update, patch]
          - apiGroups: [apps.gitlab.com]
            resources: [gitlabcores/finalizers]
            verbs: [update]
          - apiGroups: [policy]
            resources: [poddisruptionbudgets]
            verbs: [get, list, watch, create, update, patch, delete]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: $NAME_OVERRIDE-manager-v2alpha1-rolebinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: $NAME_OVERRIDE-manager-v2alpha1-role
          subjects:
          - kind: ServiceAccount
            name: $NAME_OVERRIDE-manager
            namespace: $NAMESPACE
          EOF
        silent: true

  openapi:
    desc: Generates the backend-for-frontend OpenAPI document from the Huma API.
    sources:
      - internal/bridge/**/*.go
      - api/v2alpha1/*.go
    generates:
      - internal/bridge/web/openapi.yaml
    cmds:
      - go run ./hack/gen-openapi -out internal/bridge/web/openapi.yaml

  frontend-client:
    desc: Generates the TypeScript API client from the OpenAPI document via openapi-typescript.
    deps:
      - openapi
    dir: internal/bridge/web
    cmds:
      - npx --yes openapi-typescript openapi.yaml -o src/lib/api/schema.d.ts

  frontend-install:
    desc: Installs the bridge SPA dependencies (npm ci).
    dir: internal/bridge/web
    sources:
      - internal/bridge/web/package.json
      - internal/bridge/web/package-lock.json
    cmds:
      - npm ci

  frontend-build:
    desc: Builds the bridge SPA into internal/bridge/web/dist (embedded via go:embed).
    deps:
      - frontend-install
      - frontend-client
    dir: internal/bridge/web
    sources:
      - internal/bridge/web/src/**/*
      - internal/bridge/web/index.html
      - internal/bridge/web/*.ts
      - internal/bridge/web/*.json
      # The SPA bakes these in at build time; see internal/bridge/web/vite.config.ts.
      - CHART_VERSIONS
    generates:
      - internal/bridge/web/dist/index.html
    cmds:
      - npm run build

  frontend-dev:
    desc: Runs the bridge SPA dev server (Vite) with HMR, proxying the API to the bridge.
    dir: internal/bridge/web
    cmds:
      - npm run dev

  vet:
    desc: Vets code using `go vet`.
    cmds:
      - go vet ./...

  fmt:
    desc: Formats code using `go fmt`.
    cmds:
      - go fmt ./...

  lint:
    desc: Lints code using `golangci-lint`.
    cmds:
      # Write the code coverage report to gl-code-quality-report.json
      # and print linting issues to stdout in the format: path/to/file:line description
      - >-
        golangci-lint run
        --output.text.path=stdout
        --output.text.print-issued-lines=false
        --output.code-climate.path=gl-code-quality-report.json
      # The e2e and bridge files are behind build tags, so the default run never
      # sees them. Lint them separately to keep them from rotting.
      - golangci-lint run --build-tags e2e ./internal/render/... ./internal/controller/...
      - golangci-lint run --build-tags bridge ./...

  manager:
    desc: Build the manager binary using `go build`.
    deps:
      - generate
      - fmt
      - vet
    cmds:
      - go build -o bin/manager ./cmd/manager

  run:
    desc: Run the manager against the cluster configured in ~/.kube/config.
    deps:
      - generate
      - fmt
      - vet
      - manifests
    cmds:
      - go run {{ .BUILD_TAGS }} ./cmd/manager

  run_bridge:
    desc: |
      Run the manager with the `bridge` build tag, which is what compiles in the bridge server and
      the v2alpha1 GitLabCore reconciler. Both stay behind ENABLE_BRIDGE at runtime.
    cmds:
      - task: run
        vars:
          BUILD_TAGS: -tags bridge

  build_dir:
    desc: Ensures that the build directory is present.
    cmds:
      - mkdir -p $BUILD_DIR

  install_dir:
    desc: Ensures that the install directory is present.
    cmds:
      - mkdir -p $INSTALL_DIR

  build_chart:
    desc: Build out the charts/ directory from the Chart.lock file.
    cmds:
      - "$HELM dependency build deploy/chart"
    sources:
      - deploy/chart/Chart.yaml
    generates:
      - deploy/chart/Chart.lock

  build_operator:
    desc: Build the cluster-wide Kubernetes Operator manifest. Honors $CLUSTER_MODE.
    cmds:
      - task: _build_operator
        vars:
          OUTPUT: operator.yaml
          CLUSTER_MODE: "$CLUSTER_MODE"

  build_operator_namespaced:
    desc: Build the Kubernetes Operator manifest in namespaced (Role/RoleBinding) mode.
    cmds:
      - task: _build_operator
        vars:
          OUTPUT: operator-namespaced.yaml
          CLUSTER_MODE: "false"

  build_operator_openshift:
    desc: Build the cluster-wide OpenShift Operator manifest. Honors $CLUSTER_MODE.
    cmds:
      - task: _build_operator
        vars:
          OUTPUT: operator-openshift.yaml
          CLUSTER_MODE: "$CLUSTER_MODE"
          SCC_API_VERSION: security.openshift.io/v1

  build_operator_openshift_namespaced:
    desc: Build the OpenShift Operator manifest in namespaced (Role/RoleBinding) mode.
    cmds:
      - task: _build_operator
        vars:
          OUTPUT: operator-openshift-namespaced.yaml
          CLUSTER_MODE: "false"
          SCC_API_VERSION: security.openshift.io/v1

  _build_operator:
    internal: true
    label: "build_operator:{{ .OUTPUT }}"
    deps:
      - build_dir
      - build_chart
    sources:
      - deploy/chart/**/*
    generates:
      - "{{ .BUILD_DIR }}/{{ .OUTPUT }}"
    cmds:
      - >-
        $HELM template deploy/chart
        --include-crds
        --namespace $NAMESPACE
        --set nameOverride=$NAME_OVERRIDE
        --set image.registry=$IMG_REGISTRY
        --set image.repository=$IMG_REPOSITORY
        --set image.name=$IMG_NAME
        --set image.tag=$TAG
        --set watchCluster={{ .CLUSTER_MODE }}
        --set nginx-ingress.create={{ .CLUSTER_MODE }}
        --set prometheus.serviceAccount.server.create={{ .CLUSTER_MODE }}
        {{ if .SCC_API_VERSION }}--set scc.apiVersion="{{ .SCC_API_VERSION }}"{{ end }}
        > $BUILD_DIR/{{ .OUTPUT }}

  deploy_operator:
    desc: Deploy controller in the configured cluster using `$HELM upgrade`.
    deps:
      - install_dir
      - build_operator
    sources:
      - deploy/chart/**/*
    cmds:
      - >-
        $HELM upgrade gitlab-operator deploy/chart
        --install
        --create-namespace
        --namespace $NAMESPACE
        --set nameOverride=$NAME_OVERRIDE
        --set image.registry=$IMG_REGISTRY
        --set image.repository=$IMG_REPOSITORY
        --set image.name=$IMG_NAME
        --set image.tag=$TAG
        --set watchCluster=$CLUSTER_MODE
        --set nginx-ingress.create=$CLUSTER_MODE
        --set prometheus.serviceAccount.server.create=$CLUSTER_MODE
        $ARGS
      - "$HELM -n $NAMESPACE get all gitlab-operator > $INSTALL_DIR/operator.yaml"

  delete_operator:
    desc: Delete controller from the configured cluster using `$HELM uninstall`.
    deps:
      - install_dir
      - build_operator
    cmds:
      - "$HELM uninstall --namespace $NAMESPACE gitlab-operator"
      - rm -f $INSTALL_DIR/operator.yaml

  test_cr_files:
    desc: List of files used for building the test Custom Resource.
    vars:
      TEST_CR_FILES:
        sh: find config/test -type f -name '*.yaml'

  build_test_cr:
    desc: Build a test GitLab custom resource using `$KUSTOMIZE build`.
    deps:
      - build_dir
      - test_cr_files
    sources:
      - "$TEST_CR_FILES"
    cmds:
      - echo $CHART_VERSION
      - (cd $TEST_CR_FILES_DIR && yq -i eval ".namespace = \"$NAMESPACE\"" kustomization.yaml)
      - >-
        $KUSTOMIZE $TEST_CR_FILES_DIR
        | sed "s/CHART_VERSION/$CHART_VERSION/g"
        | sed "s/DOMAIN/$DOMAIN/g"
        | sed "s/HOSTSUFFIX/$HOSTSUFFIX/g"
        | sed "s/TLS_SECRET/$TLS_SECRET/g" > $BUILD_DIR/test_cr.yaml

  deploy_test_cr:
    desc: Applies the test Custom Resource using `$KUBECTL apply`.
    deps:
      - build_test_cr
    sources:
      - "$BUILD_DIR/test_cr.yaml"
    cmds:
      - "$KUBECTL apply -f $BUILD_DIR/test_cr.yaml"
      - cp $BUILD_DIR/test_cr.yaml $INSTALL_DIR/

  delete_test_cr:
    desc: Deletes the test Custom Resource using `$KUBECTL delete`.
    deps:
      - build_test_cr
    cmds:
      - "$KUBECTL delete -f $INSTALL_DIR/test_cr.yaml"

  restore_kustomize_files:
    desc: Restores the state of the config/test directory using `git checkout`.
    cmds:
      - git checkout -q config/test/base/kustomization.yaml
      - git checkout -q config/test/overlays/k8s_1_25/kustomization.yaml

  clean:
    desc: Clean up build and install directories.
    cmds:
      - rm -rf $BUILD_DIR $INSTALL_DIR

  retrieve-charts:
    desc: Retrieves GitLab charts at the versions in the CHART_VERSIONS file.
    sources:
      - ./scripts/retrieve_gitlab_charts.sh
      - ./CHART_VERSIONS
    cmds:
      - ./scripts/retrieve_gitlab_charts.sh

  retrieve-charts-custom-ref:
    desc: Retrieves GitLab charts from a custom ref (defaults to master).
    sources:
      - ./scripts/retrieve_gitlab_charts_custom_ref.sh
    cmds:
      - ./scripts/retrieve_gitlab_charts_custom_ref.sh
    generates:
      - CHART_NIGHTLY_VERSION
    status: # check whether the requested version is in the charts directory
      - ls -A charts | sort | grep -q $(./scripts/retrieve_gitlab_charts_custom_ref.sh --ref)

  docker-build:
    desc: Build the Docker image using `$CONTAINER_CLI build`.
    deps:
      - retrieve-charts
    cmds:
      - mkdir -p .go/pkg/mod
      - $CONTAINER_CLI build . -t $IMG_REGISTRY/$IMG_REPOSITORY/$IMG_NAME:$TAG

  docker-push:
    desc: Push the Docker image using `$CONTAINER_CLI push`.
    cmds:
      - $CONTAINER_CLI push $IMG_REGISTRY/$IMG_REPOSITORY/$IMG_NAME:$TAG

  docker-build-bridge:
    desc: Build the bridge-enabled Docker image (Dockerfile.bridge, `-tags bridge`, `-bridge` suffix).
    deps:
      - retrieve-charts
    cmds:
      - mkdir -p .go/pkg/mod
      - $CONTAINER_CLI build -f Dockerfile.bridge . -t $IMG_REGISTRY/$IMG_REPOSITORY/$IMG_NAME:$TAG-bridge

  docker-push-bridge:
    desc: Push the bridge-enabled Docker image using `$CONTAINER_CLI push`.
    cmds:
      - $CONTAINER_CLI push $IMG_REGISTRY/$IMG_REPOSITORY/$IMG_NAME:$TAG-bridge

  build-kubectl-plugin:
    desc: Build the `kubectl bridge` plugin (runs the bridge locally under your kubeconfig).
    deps:
      - frontend-build
    cmds:
      - mkdir -p bin
      - go build -o bin/kubectl-bridge ./cmd/kubectl-bridge

  install-kubectl-plugin:
    desc: Install the `kubectl bridge` plugin with `go install` (into GOBIN, or GOPATH/bin).
    deps:
      - frontend-build
    vars:
      # Where `go install` puts the binary: GOBIN when set, otherwise GOPATH/bin.
      BIN_DIR:
        sh: go env GOBIN | grep . || echo "$(go env GOPATH)/bin"
    cmds:
      - go install ./cmd/kubectl-bridge
      - 'echo "Installed {{.BIN_DIR}}/kubectl-bridge. Ensure {{.BIN_DIR}} is on PATH, then run: kubectl bridge"'

  unit-tests:
    desc: |
      Runs unit tests locally, but skip the slow controller tests.
      Remember to retrieve the correct charts before running this task.
    vars:
      TEST_PKGS: '{{ default "./..." .TEST_PKGS }}'
      SKIP_ENVTEST: '{{ default "yes" .SKIP_ENVTEST }}'
      SKIP_OPERATION_TESTS: '{{ default "no" .SKIP_OPERATION_TESTS }}'
      # if skip operation test, skip the operation_test.go file
      EXTRA_FLAGS: '{{ if eq .SKIP_OPERATION_TESTS "yes" }}--skip-file=operation_test --skip-file=gitlab_webhook_test{{ end }}'
    cmds:
      # --skip-package=bridge excludes internal/bridge: it is gated behind the
      # `bridge` build tag and has its own job (see bridge-unit-tests).
      - >-
        CHART_VERSION=$CHART_VERSION
        SKIP_ENVTEST={{ .SKIP_ENVTEST }}
        go run github.com/onsi/ginkgo/v2/ginkgo -cover -output-dir=coverage --skip-package=bridge {{ .EXTRA_FLAGS }} {{ .TEST_PKGS }}

  slow-unit-tests:
    desc: |
      Runs unit tests locally, including the slow controller tests.
      Remember to retrieve the correct charts before running this task.
    cmds:
      - task: unit-tests
        vars:
          SKIP_ENVTEST: "no"
          TEST_PKGS: './controllers/...'

  bridge-unit-tests:
    desc: |
      Runs the bridge (internal/bridge) unit tests. These use plain `go test` +
      testify and are excluded from `unit-tests`; no charts or envtest needed.
    vars:
      SKIP_ENVTEST: '{{ default "yes" .SKIP_ENVTEST }}'
    cmds:
      - SKIP_ENVTEST={{ .SKIP_ENVTEST }} go test ./internal/bridge/...

  e2e-tests:
    desc: |
      Runs the end-to-end tests against the cluster of the current kubeconfig
      context. These create and delete namespaces, so point kubectl at a
      throwaway cluster. Gated behind the `e2e` build tag, so `unit-tests`
      never picks them up.

      The GitLabCore reconciler test needs the v2alpha1 definitions in the
      cluster; it skips without them. Install them with
      `task install_v2alpha1_crds`.

      In internal/render: set E2E_APPLY_CRDS=1 to install the chart
      definitions, and E2E_APPLY_WORKLOADS=1 to apply the chart workloads,
      which need real PostgreSQL, Redis, and object storage to become ready.
      Both write cluster-wide, so they are off by default.

      In internal/controller: set E2E_CLUSTER_SCOPED=1 to let the release
      render cluster-scoped objects and definitions, which writes outside the
      test namespace. It is off by default.

      Set E2E_KEEP_NAMESPACE=1 to inspect the namespace afterwards. The
      cluster-scoped objects are then kept too, so delete them by hand.
    deps:
      - retrieve-charts
    vars:
      TEST_PKGS: '{{ default "./internal/render/... ./internal/controller/..." .TEST_PKGS }}'
      TIMEOUT: '{{ default "30m" .TIMEOUT }}'
    cmds:
      - echo "Running e2e tests against $(kubectl config current-context)..."
      - go test -tags e2e -count=1 -timeout {{ .TIMEOUT }} -v {{ .TEST_PKGS }}

  test-in-docker:
    desc: Runs tests in a Docker container.
    deps:
      - retrieve-charts
      - ginkgo
    vars:
      TEST_PKGS: '{{ default "./..." .TEST_PKGS }}'
    cmds:
      - echo "Testing {{.TEST_PKGS}} with $CHART_VERSION on $TEST_IMG..."
      - rm -rf coverage && mkdir coverage
      - GOPATH=$PWD/.go go mod download
      - >-
        docker run -i
        --name operator-unit-tests
        -v $PWD:/test
        -w /test
        -e CHART_VERSION=$CHART_VERSION
        -e GOPATH="/test/.go"
        -e HELM_CHARTS="/test/charts"
        -e KUBECONFIG=""
        -e USE_EXISTING_CLUSTER="false"
        $TEST_IMG
        go run github.com/onsi/ginkgo/v2/ginkgo -cover -outputdir=coverage {{.TEST_PKGS}}

  unit-tests-in-docker:
    desc: Run unit tests in Docker, but skip the slow controller tests.
    cmds:
      - task: test-in-docker
        vars:
          TEST_PKGS: ./helm/... ./pkg/...

  slow-unit-tests-in-docker:
    desc: Run unit tests in Docker, focusing on only the slow controller tests.
    cmds:
      - task: test-in-docker
        vars:
          TEST_PKGS: ./controllers/...

  test-in-docker-clean:
    desc: Clean up artifacts from testing in Docker.
    cmds:
      - rm -rf .go coverage
      - docker rmi $TEST_IMG
      - docker rm operator-unit-tests
