---
apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
spec:
  chart:
    values:
      global:
        gatewayApi:
          # The GatewayClass and the Envoy Gateway installation are provisioned
          # on the cluster, outside the release: the chart renders neither.
          installEnvoy: false
      gatewayApiResources:
        class:
          name: ci-stack
      gitlab:
        gitlab-shell:
          enabled: false
