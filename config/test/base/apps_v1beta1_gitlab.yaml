---
apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
spec:
  chart:
    version: CHART_VERSION
    values:
      installCertmanager: false
      global:
        hosts:
          domain: DOMAIN
          hostSuffix: HOSTSUFFIX
        ingress:
          configureCertmanager: false
          tls:
            secretName: TLS_SECRET
        minio:
          enabled: false
        psql:
          host: PSQL_HOST
          password: 
            secret: PSQL_SECRET
            key: password
        redis:
          host: REDIS_HOST
          auth:
            secret: REDIS_SECRET
            key: password
        appConfig:
          object_store:
            enabled: true
            proxy_download: true
            connection:
              secret: OBJECT_STORE_SECRET
              key: config
          artifacts:
            bucket: gitlab-artifacts
          lfs:
            bucket: git-lfs
          uploads:
            bucket: gitlab-uploads
          packages:
            bucket: gitlab-packages
          externalDiffs:
            enabled: true
            bucket: gitlab-mr-diffs
          terraformState:
            enabled: true
            bucket: gitlab-terraform-state
          ciSecureFiles:
            enabled: true
            bucket: gitlab-ci-secure-files
          dependencyProxy:
            enabled: true
            bucket: gitlab-dependency-proxy
      redis:
        install: false
      postgresql:
        install: false
      gitlab:
        webservice:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 500m
              memory: 1500M
        sidekiq:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 500m
              memory: 1000M
        gitlab-shell:
          minReplicas: 1
          maxReplicas: 2
        toolbox:
          backups:
            objectStorage:
              config:
                secret: OBJECT_STORE_SECRET_S3CMD
                key: config
      nginx-ingress:
        controller:
          electionID: ingress-controller-leader
          replicaCount: 1
      registry:
        storage:
          secret: OBJECT_STORE_SECRET_REGISTRY
          key: config
          redirect:
            disable: true
