---
apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
spec:
  chart:
    version: CHART_VERSION
    values:
      certmanager:
        install: false
      global:
        hosts:
          domain: DOMAIN
          hostSuffix: HOSTSUFFIX
        ingress:
          configureCertmanager: false
          tls:
            secretName: TLSSECRETNAME
      postgresql:
        primary:
          extendedConfiguration: |-
            max_connections = 200
      gitlab:
        webservice:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 500m
              memory: 1500M
        sidekiq:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 500m
              memory: 1000M
        gitlab-shell:
          minReplicas: 1
          maxReplicas: 2
      nginx-ingress:
        controller:
          replicaCount: 1
      redis:
        resources:
          requests:
            cpu: 100m
      minio:
        resources:
          requests:
            cpu: 100m
