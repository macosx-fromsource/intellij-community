---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: gitlabcores.apps.gitlab.com
spec:
  group: apps.gitlab.com
  names:
    kind: GitLabCore
    listKind: GitLabCoreList
    plural: gitlabcores
    shortNames:
    - glc
    singular: gitlabcore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: STATUS
      type: string
    - jsonPath: .status.version
      name: VERSION
      type: string
    - jsonPath: .status.gitlabVersion
      name: GITLAB
      type: string
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GitLabCore is a complete DevOps platform, delivered in a single application.

          It is a definition of its own, separate from the `v1beta1` GitLab resource, and the two do not
          convert into each other.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Specification of the desired behavior of a GitLab instance.
            properties:
              chart:
                description: Chart is the specification of the GitLab umbrella chart
                  that is used to deploy the instance.
                properties:
                  values:
                    description: |-
                      Values is the set of Helm values that is used to render the chart. A validating webhook
                      checks the effective values against the `values.schema.json` of the chart.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  version:
                    description: Version is the semantic version of the Helm chart.
                    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
                    type: string
                type: object
              edition:
                default: ee
                description: |-
                  Edition is the GitLab edition to deploy: `ee` for Enterprise Edition, `ce` for Community
                  Edition. Enterprise Edition runs unlicensed with the Free feature set, so it is the default
                  and the edition to pick unless the instance has to carry no proprietary code at all.
                enum:
                - ce
                - ee
                type: string
              hostname:
                description: |-
                  Hostname is the fully qualified domain name that the GitLab instance is reached at, for
                  example `gitlab.example.com`.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
              license:
                description: |-
                  License references the GitLab license to activate the instance with. The license is a
                  reference to a Secret, so no license key is stored in the custom resource.
                properties:
                  secretRef:
                    description: SecretRef selects the key of the Secret that holds
                      the license.
                    properties:
                      key:
                        description: Key is the key of the Secret to read.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretRef
                type: object
              objectStorage:
                description: |-
                  ObjectStorage is the S3 compatible object storage the instance keeps its artifacts,
                  uploads, and other blobs in. The chart enables object storage for these with no connection
                  of its own, so an instance without this field, or without the equivalent free-form chart
                  values, does not render.
                properties:
                  connectionSecretRef:
                    description: ConnectionSecretRef selects the key of the Secret
                      that holds the connection settings.
                    properties:
                      key:
                        description: Key is the key of the Secret to read.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - connectionSecretRef
                type: object
              openbao:
                description: |-
                  OpenBao backs the GitLab Secret Manager with an OpenBao instance. Naming it also turns on
                  both the GitLab-side integration and the bundled OpenBao subchart; an instance without
                  this field runs with the Secret Manager off. See
                  https://docs.gitlab.com/charts/charts/openbao/#setup-gitlab-secret-manager-and-openbao.
                properties:
                  postgresql:
                    description: |-
                      PostgreSQL is the PostgreSQL server OpenBao stores its data in, separate from the
                      database of the GitLab instance itself.
                    properties:
                      database:
                        default: openbao
                        description: Database is the database OpenBao stores its data
                          in.
                        maxLength: 63
                        minLength: 1
                        type: string
                      host:
                        description: Host is the hostname of the PostgreSQL server.
                        maxLength: 253
                        minLength: 1
                        type: string
                      passwordSecretRef:
                        description: |-
                          PasswordSecretRef selects the key of the Secret that holds the password of the database
                          user. OpenBao does not inherit the password of the instance's own database, so this is
                          required rather than defaulted.
                        properties:
                          key:
                            description: Key is the key of the Secret to read.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      port:
                        default: 5432
                        description: Port is the port of the PostgreSQL server.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      username:
                        default: openbao
                        description: Username is the login role OpenBao connects as.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - host
                    - passwordSecretRef
                    type: object
                  serviceAccount:
                    description: |-
                      ServiceAccount names the ServiceAccount OpenBao's pod runs as. OpenBao needs a Role
                      granting get/update/patch on Pods in the namespace of the instance, and a RoleBinding
                      binding that Role to the ServiceAccount. The Operator creates neither: it does not manage
                      RBAC on the cluster it reconciles, by design. Create the ServiceAccount, the Role, and the
                      RoleBinding ahead of time, and name the ServiceAccount here.
                    properties:
                      name:
                        description: Name is the name of the ServiceAccount, already
                          granted the Role OpenBao needs.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - postgresql
                - serviceAccount
                type: object
              postgresql:
                description: |-
                  PostgreSQL is the PostgreSQL server the instance stores its data in. The chart bundles no
                  database, so an instance without this field, or without the equivalent free-form chart
                  values, does not render.
                properties:
                  host:
                    description: |-
                      Host is the hostname of the PostgreSQL server, for example
                      `gitlab-postgresql.databases.svc.cluster.local`.
                    maxLength: 253
                    minLength: 1
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef selects the key of the Secret that holds the password of the database
                      user. The password is a reference to a Secret, so no password is stored in the custom
                      resource.
                    properties:
                      key:
                        description: Key is the key of the Secret to read.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - host
                - passwordSecretRef
                type: object
              redis:
                description: |-
                  Redis is the Redis server the instance uses for caching, queues, and shared state. Valkey
                  serves as a drop-in replacement. The chart bundles no server, so an instance without this
                  field, or without the equivalent free-form chart values, does not render.
                properties:
                  host:
                    description: |-
                      Host is the hostname of the Redis server, for example
                      `gitlab-valkey.databases.svc.cluster.local`.
                    maxLength: 253
                    minLength: 1
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef selects the key of the Secret that holds the password of the server. The
                      password is a reference to a Secret, so no password is stored in the custom resource.
                    properties:
                      key:
                        description: Key is the key of the Secret to read.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - host
                - passwordSecretRef
                type: object
              upgrade:
                description: Upgrade tunes how the Operator carries out a zero-downtime
                  upgrade.
                properties:
                  skipBatchedMigrationCheck:
                    description: |-
                      SkipBatchedMigrationCheck lets an upgrade advance to the next version without waiting for the
                      batched background migrations of the current one to finish. GitLab requires those complete
                      before the next upgrade, so skipping the wait risks data inconsistency and failed migrations;
                      leave it off except on instances (for example development or test ones) where that risk is
                      acceptable in exchange for a faster upgrade.
                    type: boolean
                type: object
            type: object
          status:
            description: |-
              Most recently observed status of the GitLab instance.
              It is read-only to the user.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gitlabVersion:
                description: |-
                  GitLabVersion is the version of the application the release deploys, without the leading
                  `v`, such as `19.3.2`. It is recorded alongside Version, so it describes what is deployed
                  rather than what the spec asks for, and a resource stepping through a multi-minor upgrade
                  reports the version it has converged to so far.

                  It is the only place the application version is published. Nothing else can derive it from
                  the resource: the chart version in the spec does not imply it, and the chart the Operator
                  renders may be one it does not carry on disk.
                type: string
              phase:
                type: string
              version:
                description: |-
                  Version is the version of the GitLab chart the release was rendered from, which is an
                  unrelated number to the version of the application it deploys. For that, read
                  GitLabVersion.
                type: string
            required:
            - conditions
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
