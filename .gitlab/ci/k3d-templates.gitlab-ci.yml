# Shared template for the k3d per-job cluster test.
#
# Included by .gitlab/ci/k3d-version-pipeline.gitlab-ci.yml (the child pipeline layer,
# one child per version matrix row) and by .gitlab-ci.yml so that
# chart-version pipelines can run the same test as a direct job
# (see review_k3d_chart_version in .gitlab/ci/review-k3d.gitlab-ci.yml).
# Relies on .dind (.gitlab/ci/templates.gitlab-ci.yml) being included alongside.

.review_k3d_template:
  extends: .dind
  stage: review
  tags:
    - e2e
  variables:
    K3D_MODE: "true"
    # The whole cluster is destroyed in after_script; per-resource cleanup
    # would only slow the job down.
    CLEANUP: "no"
    # Wait up to 15 minutes for GitLab to reach Running: a fresh k3d cluster
    # pulls every image cold.
    GITLAB_RUNNING_MAXATTEMPTS: "90"
    # Allow Docker (DinD) to reach in-cluster services over HTTP: nip.io
    # hostnames resolve to private IPs in 172.16.0.0/12.
    DOCKER_OPTIONS: "--registry-mirror ${DOCKER_MIRROR} --insecure-registry 172.16.0.0/12"
    QA_ARTIFACTS_DIR: $CI_PROJECT_DIR
    QA_CAN_TEST_PRAEFECT: "false"
    # License is activated via QA_EE_ACTIVATION_CODE, a project CI/CD variable
    # picked up automatically by gitlab-qa (no explicit mapping needed).
    QA_OPTIONS: "--tag smoke"
  before_script:
    - source .gitlab/ci/scripts/k3d.sh
    - k3d_install
    # Ruby is needed for gitlab-qa; the build-base image does not ship it.
    - apk add --no-cache ruby ruby-dev
    - gem install gitlab-qa --no-document
    - source .gitlab/ci/scripts/trim_env.sh
  script:
    - k3d_create
    - k3d_info
    - kubectl version --output=json
    # cert-manager is required by the operator's webhook certificate
    # (manager.webhook.selfSignedCert); a fresh k3d cluster has nothing
    # pre-installed. The GitLab instance itself is served over plain HTTP.
    # The Gateway API rows additionally install Envoy Gateway (Gateway API
    # CRDs + controller) and enable cert-manager's Gateway API support,
    # mirroring the vcluster-flux path.
    - |
      if [ "$INSTALL_ENVOY_GATEWAY" = "true" ]; then
        task install_envoy_gateway
        task install_certmanager_envoy
      else
        task install_certmanager
      fi
    - task wait_certmanager
    # Deploy the operator, external services, and the GitLab CR, then wait
    # until the instance is Running and answering on its endpoint.
    - ./scripts/test.sh
    # Run the QA smoke suite against the deployed instance (same cluster,
    # same job). Exit code 42 marks QA failures as warnings while deployment
    # failures still fail the job hard.
    - export ROOT_PASSWORD=$(kubectl -n $TESTS_NAMESPACE get secret gitlab-gitlab-initial-root-password -ojsonpath='{.data.password}' | base64 --decode)
    - export GITLAB_VERSION=$(kubectl -n $TESTS_NAMESPACE exec -i $(kubectl -n $TESTS_NAMESPACE get pods | grep sidekiq | awk '{print $1}') -c sidekiq -- cat /srv/gitlab/VERSION)
    - export QA_ENVIRONMENT_URL="http://gitlab-${HOSTSUFFIX}.${DOMAIN}"
    # Mint a fresh admin PAT so gitlab-qa builds its admin API client from a
    # token instead of signing in as root through the UI — the first UI login
    # on a fresh instance lands on the onboarding page and fails page
    # validation before any example runs.
    - export GITLAB_QA_ADMIN_ACCESS_TOKEN=$(NO_TRAP=1 ./scripts/test.sh create_qa_admin_token)
    - |
      http_code=$(curl -sSo /dev/null -w "%{http_code}" \
        --header "PRIVATE-TOKEN: ${GITLAB_QA_ADMIN_ACCESS_TOKEN}" \
        "${QA_ENVIRONMENT_URL}/api/v4/user")
      if [ "${http_code}" != "200" ]; then
        echo "Pre-flight check failed: GET /api/v4/user returned HTTP ${http_code} (expected 200)"
        exit 1
      fi
    - echo "Running - 'gitlab-qa Test::Instance::Any EE:$GITLAB_VERSION $QA_ENVIRONMENT_URL -- $QA_OPTIONS'"
    - SIGNUP_DISABLED=true QA_DEBUG=true GITLAB_USERNAME=root GITLAB_PASSWORD=$ROOT_PASSWORD GITLAB_ADMIN_USERNAME=root GITLAB_ADMIN_PASSWORD=$ROOT_PASSWORD gitlab-qa Test::Instance::Any EE:$GITLAB_VERSION $QA_ENVIRONMENT_URL -- $QA_OPTIONS || exit 42
  after_script:
    - source .gitlab/ci/scripts/trim_env.sh
    - source .gitlab/ci/scripts/k3d.sh
    - k3d_collect_debug
    - k3d_delete
  artifacts:
    when: always
    expire_in: 7d
    paths:
      - ./gitlab-qa-run-*
      - ./k3d-debug/
  retry: 1
  allow_failure:
    exit_codes: 42

# Manual full E2E suite variant of .review_k3d_template: same self-contained
# deploy-then-QA job, but running the full suite (QA_FULL_SUITE_OPTIONS)
# instead of the smoke tags. Retried automatically nowhere — the full suite
# is expensive, so a flaky run should surface rather than silently re-run.
.review_k3d_full_template:
  extends: .review_k3d_template
  variables:
    QA_OPTIONS: $QA_FULL_SUITE_OPTIONS
  retry: 0
