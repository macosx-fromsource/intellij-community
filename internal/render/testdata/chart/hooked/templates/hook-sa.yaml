apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-hooked-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    # Events with surrounding whitespace and mixed case exercise the
    # normalization; the negative weight exercises the execution order.
    "helm.sh/hook": pre-install, Pre-Upgrade
    "helm.sh/hook-weight": "-5"
