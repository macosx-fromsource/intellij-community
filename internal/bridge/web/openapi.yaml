components:
  schemas:
    ChartDTO:
      additionalProperties: false
      properties:
        values:
          additionalProperties: {}
          description: Free-form Helm values used to render the chart. They are merged over the values derived from the structured fields and win on conflict.
          type: object
        version:
          description: Semantic version of the Helm chart.
          type: string
      type: object
    ChartVersionsDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChartVersionsDTO.json
          format: uri
          readOnly: true
          type: string
        versions:
          description: GitLab chart versions the Operator carries, newest first.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - versions
      type: object
    Condition:
      additionalProperties: false
      properties:
        lastTransitionTime:
          type: string
        message:
          type: string
        observedGeneration:
          format: int64
          type: integer
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
        - type
        - status
        - lastTransitionTime
        - reason
        - message
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GitLabList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GitLabList.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The GitLab resources.
          items:
            $ref: "#/components/schemas/GitLabResource"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    GitLabResource:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GitLabResource.json
          format: uri
          readOnly: true
          type: string
        chart:
          $ref: "#/components/schemas/ChartDTO"
          description: GitLab Chart configuration.
        edition:
          description: "GitLab edition to deploy: 'ee' for Enterprise Edition, which runs unlicensed with the Free feature set, or 'ce' for Community Edition."
          enum:
            - ce
            - ee
          examples:
            - ee
          type: string
        hostname:
          description: Fully qualified domain name the GitLab instance is reached at.
          examples:
            - gitlab.example.com
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels applied to the GitLab resource.
          type: object
        license:
          $ref: "#/components/schemas/LicenseDTO"
          description: Reference to the GitLab license to activate the instance with.
        name:
          description: Name of the GitLab resource.
          type: string
        namespace:
          description: Namespace the GitLab resource lives in.
          type: string
        objectStorage:
          $ref: "#/components/schemas/ObjectStorageDTO"
          description: "S3 compatible object storage the instance keeps its artifacts, uploads, and other blobs in. The chart needs one: it enables object storage for these with no connection of its own. See https://docs.gitlab.com/charts/charts/globals/#connection."
        openbao:
          $ref: "#/components/schemas/OpenBaoDTO"
          description: Backs the GitLab Secret Manager with an OpenBao instance. Naming it turns on both the GitLab-side integration and the bundled OpenBao subchart. See https://docs.gitlab.com/charts/charts/openbao/#setup-gitlab-secret-manager-and-openbao.
        postgresql:
          $ref: "#/components/schemas/PostgreSQLDTO"
          description: PostgreSQL server the instance stores its data in. The chart bundles no database. See https://docs.gitlab.com/install/requirements/#postgresql.
        redis:
          $ref: "#/components/schemas/RedisDTO"
          description: Redis server the instance uses for caching, queues, and shared state; Valkey serves as a drop-in replacement. The chart bundles no server. See https://docs.gitlab.com/install/requirements/#redis.
        status:
          $ref: "#/components/schemas/StatusDTO"
          description: Most recently observed status. Read-only.
          readOnly: true
      required:
        - name
        - namespace
        - chart
      type: object
    LicenseDTO:
      additionalProperties: false
      properties:
        secretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the license.
      required:
        - secretRef
      type: object
    LocalSecretRefDTO:
      additionalProperties: false
      properties:
        name:
          description: Name of the Secret.
          maxLength: 253
          minLength: 1
          type: string
      required:
        - name
      type: object
    ObjectStorageDTO:
      additionalProperties: false
      properties:
        connectionSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the connection settings.
      required:
        - connectionSecretRef
      type: object
    OpenBaoDTO:
      additionalProperties: false
      properties:
        postgresql:
          $ref: "#/components/schemas/OpenBaoPostgreSQLDTO"
          description: PostgreSQL server OpenBao stores its data in, separate from the database of the GitLab instance itself. OpenBao does not inherit that database's password.
        serviceAccount:
          $ref: "#/components/schemas/OpenBaoServiceAccountDTO"
          description: "Pre-existing ServiceAccount OpenBao's pod runs as. OpenBao needs a Role granting get/update/patch on Pods and a RoleBinding to it, neither of which the bridge or the Operator creates: RBAC is not managed on the cluster they reconcile. Create both ahead of time."
      required:
        - postgresql
        - serviceAccount
      type: object
    OpenBaoPostgreSQLDTO:
      additionalProperties: false
      properties:
        database:
          description: Database OpenBao stores its data in. Defaults to 'openbao'.
          examples:
            - openbao
          maxLength: 63
          minLength: 1
          type: string
        host:
          description: Hostname of the PostgreSQL server.
          examples:
            - openbao-postgresql.databases.svc.cluster.local
          maxLength: 253
          minLength: 1
          type: string
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password of the database user.
        port:
          description: Port of the PostgreSQL server. Defaults to 5432.
          examples:
            - 5432
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        username:
          description: Login role OpenBao connects as. Defaults to 'openbao'.
          examples:
            - openbao
          maxLength: 63
          minLength: 1
          type: string
      required:
        - host
        - passwordSecretRef
      type: object
    OpenBaoServiceAccountDTO:
      additionalProperties: false
      properties:
        name:
          description: Name of the ServiceAccount, already granted the Role OpenBao needs.
          maxLength: 253
          minLength: 1
          type: string
      required:
        - name
      type: object
    PostgreSQLDTO:
      additionalProperties: false
      properties:
        host:
          description: Hostname of the PostgreSQL server.
          examples:
            - gitlab-postgresql.databases.svc.cluster.local
          maxLength: 253
          minLength: 1
          type: string
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password of the database user.
      required:
        - host
        - passwordSecretRef
      type: object
    RedisDTO:
      additionalProperties: false
      properties:
        host:
          description: Hostname of the Redis server.
          examples:
            - gitlab-valkey.databases.svc.cluster.local
          maxLength: 253
          minLength: 1
          type: string
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password of the server.
      required:
        - host
        - passwordSecretRef
      type: object
    SecretRefDTO:
      additionalProperties: false
      properties:
        key:
          description: Key of the Secret to read.
          maxLength: 253
          minLength: 1
          type: string
        name:
          description: Name of the Secret.
          maxLength: 253
          minLength: 1
          type: string
      required:
        - name
        - key
      type: object
    SiphonQueueAuthDTO:
      additionalProperties: false
      properties:
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password.
        usernameSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the user name.
      required:
        - usernameSecretRef
        - passwordSecretRef
      type: object
    SiphonQueueDTO:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/SiphonQueueAuthDTO"
          description: User name and password the client authenticates with. Leave it out for a server that accepts anonymous clients.
        tls:
          $ref: "#/components/schemas/SiphonQueueTLSDTO"
          description: Client certificate the connection presents.
        url:
          description: URL of the NATS server.
          examples:
            - nats://nats.nats.svc.cluster.local:4222
          maxLength: 2048
          minLength: 1
          pattern: ^nats://
          type: string
      required:
        - url
      type: object
    SiphonQueueTLSDTO:
      additionalProperties: false
      properties:
        caCertKey:
          description: Key holding the certificate authority bundle. Defaults to 'ca.crt'.
          examples:
            - ca.crt
          maxLength: 253
          minLength: 1
          type: string
        clientCertKey:
          description: Key holding the client certificate. Defaults to 'tls.crt'.
          examples:
            - tls.crt
          maxLength: 253
          minLength: 1
          type: string
        clientKeyKey:
          description: Key holding the client private key. Defaults to 'tls.key'.
          examples:
            - tls.key
          maxLength: 253
          minLength: 1
          type: string
        secretName:
          description: Name of the Secret in the namespace of the resource.
          maxLength: 253
          minLength: 1
          type: string
      required:
        - secretName
      type: object
    SiphonResource:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SiphonResource.json
          format: uri
          readOnly: true
          type: string
        chart:
          $ref: "#/components/schemas/ChartDTO"
          description: "Siphon chart configuration. Only a version the Operator bundles renders: unlike the GitLab chart, a Siphon chart is never pulled."
        gitlabRef:
          description: Name of the GitLabCore instance whose database this pipeline streams.
          readOnly: true
          type: string
        name:
          description: Name of the Siphon resource. The bridge derives it from the GitLab instance when it creates one.
          readOnly: true
          type: string
        namespace:
          description: Namespace the Siphon resource lives in, which is the namespace of the GitLab instance.
          readOnly: true
          type: string
        queue:
          $ref: "#/components/schemas/SiphonQueueDTO"
          description: "NATS server the stream passes through. JetStream must be enabled: Siphon uses streams, a key-value bucket, and an object store."
        sink:
          $ref: "#/components/schemas/SiphonSinkDTO"
          description: ClickHouse server the stream is written to, over the native protocol. Its target tables are created by the ClickHouse migrations of GitLab, not by Siphon.
        source:
          $ref: "#/components/schemas/SiphonSourceDTO"
          description: "PostgreSQL server the change data capture stream reads. It must be the primary: a logical replication slot is not created on a standby."
        status:
          $ref: "#/components/schemas/SiphonStatusDTO"
          description: Most recently observed status. Read-only.
          readOnly: true
        tables:
          $ref: "#/components/schemas/SiphonTablesDTO"
          description: How the table definitions of the deployed GitLab version reach the pods. They ship as an OCI image tagged with the GitLab version the referenced instance runs.
      required:
        - source
        - queue
        - sink
        - chart
      type: object
    SiphonSinkDTO:
      additionalProperties: false
      properties:
        database:
          description: Database holding the target tables.
          examples:
            - gitlab_clickhouse_main_production
          maxLength: 63
          minLength: 1
          type: string
        host:
          description: Hostname of the ClickHouse server.
          examples:
            - clickhouse.databases.svc.cluster.local
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password of that user.
        port:
          description: Port of the ClickHouse native protocol, not of the HTTP interface. Defaults to 9000; 8123 is the HTTP interface, which Siphon does not speak.
          examples:
            - 9000
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        ssl:
          description: Turns TLS on for the native protocol connection. The port changes with it, so set both.
          type: boolean
        username:
          description: ClickHouse user the consumer and the reconciler connect as. It needs INSERT and SELECT on the target tables.
          examples:
            - gitlab
          maxLength: 63
          minLength: 1
          type: string
      required:
        - host
        - database
        - username
        - passwordSecretRef
      type: object
    SiphonSourceDTO:
      additionalProperties: false
      properties:
        advisoryLockID:
          description: PostgreSQL advisory lock the producer takes to elect itself. Defaults to 1; change it only to run a second, independent stream off the same database.
          format: int32
          maximum: 2147483647
          minimum: 1
          type: integer
        database:
          description: "Database to replicate. Defaults to 'gitlabhq_production' and is immutable: changing it re-snapshots every table."
          examples:
            - gitlabhq_production
          maxLength: 63
          minLength: 1
          type: string
        host:
          description: Hostname of the PostgreSQL primary.
          examples:
            - gitlab-postgresql-rw.databases.svc.cluster.local
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        passwordSecretRef:
          $ref: "#/components/schemas/SecretRefDTO"
          description: Key of the Secret that holds the password of that role.
        port:
          description: Port of the PostgreSQL server. Defaults to 5432.
          examples:
            - 5432
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        sslMode:
          description: libpq TLS mode of the connection. Defaults to 'require'.
          enum:
            - disable
            - allow
            - prefer
            - require
            - verify-ca
            - verify-full
          examples:
            - require
          type: string
        user:
          description: Login role the producer connects as. It needs REPLICATION, EXECUTE on siphon_alter_publication, and SELECT on the replicated tables. Defaults to 'siphon'.
          examples:
            - siphon
          maxLength: 63
          minLength: 1
          type: string
      required:
        - host
        - passwordSecretRef
      type: object
    SiphonStatusDTO:
      additionalProperties: false
      properties:
        conditions:
          description: Detailed status conditions.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        gitlabVersion:
          description: Application version of the referenced instance, the version the table definitions are pinned to.
          type: string
        phase:
          description: Current lifecycle phase.
          type: string
        publication:
          description: PostgreSQL publication the producer reads. Deleting the resource leaves it behind.
          type: string
        replicationSlot:
          description: PostgreSQL replication slot the producer holds. Deleting the resource leaves it behind.
          type: string
        streamName:
          description: NATS JetStream stream the events pass through. Deleting the resource leaves it behind.
          type: string
        tableCount:
          description: How many table definitions the pipeline carries.
          format: int32
          type: integer
        tablesImage:
          description: Fully resolved table definitions image reference.
          type: string
        tablesSource:
          description: What the table definitions source resolved to, 'ImageVolume' or 'ConfigMap'.
          type: string
        version:
          description: Deployed Siphon chart version.
          type: string
      type: object
    SiphonTablesDTO:
      additionalProperties: false
      properties:
        image:
          description: Overrides the table definitions image. Left out, it is the GitLab image tagged with the application version of the referenced instance.
          maxLength: 512
          type: string
        pullSecretRef:
          $ref: "#/components/schemas/LocalSecretRefDTO"
          description: A kubernetes.io/dockerconfigjson Secret the image is pulled with. Leave it out for the public image.
        source:
          description: Where the definitions come from. 'ImageVolume' mounts the image into the pod, which needs a runtime that serves OCI image volumes. 'ConfigMap' has the Operator extract it. 'Auto', the default, resolves to 'ConfigMap'.
          enum:
            - Auto
            - ImageVolume
            - ConfigMap
          examples:
            - Auto
          type: string
      type: object
    StatusDTO:
      additionalProperties: false
      properties:
        conditions:
          description: Detailed status conditions.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        gitlabVersion:
          description: Deployed GitLab version, such as 19.3.2.
          type: string
        phase:
          description: Current lifecycle phase.
          type: string
        version:
          description: Deployed GitLab chart version, an unrelated number to the GitLab version it deploys.
          type: string
      type: object
  securitySchemes:
    bearer:
      description: Kubernetes bearer token. The API acts as the caller identified by this token, subject to the caller's own RBAC.
      scheme: bearer
      type: http
info:
  title: GitLab Operator Bridge
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/chart-versions:
    get:
      operationId: list-chart-versions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartVersionsDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the GitLab chart versions available to install or upgrade to
      tags:
        - charts
  /api/v1/gitlabs:
    get:
      operationId: list-gitlabs-all-namespaces
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List GitLab resources across all watched namespaces
      tags:
        - gitlabs
  /api/v1/namespaces/{namespace}/gitlabs:
    get:
      operationId: list-gitlabs
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List GitLab resources in a namespace
      tags:
        - gitlabs
    post:
      operationId: create-gitlab
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitLabResource"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabResource"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a GitLab resource
      tags:
        - gitlabs
  /api/v1/namespaces/{namespace}/gitlabs/{name}:
    delete:
      operationId: delete-gitlab
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
        - description: Name of the GitLab resource.
          in: path
          name: name
          required: true
          schema:
            description: Name of the GitLab resource.
            examples:
              - gitlab
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a GitLab resource
      tags:
        - gitlabs
    get:
      operationId: get-gitlab
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
        - description: Name of the GitLab resource.
          in: path
          name: name
          required: true
          schema:
            description: Name of the GitLab resource.
            examples:
              - gitlab
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabResource"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a GitLab resource
      tags:
        - gitlabs
    put:
      operationId: update-gitlab
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
        - description: Name of the GitLab resource.
          in: path
          name: name
          required: true
          schema:
            description: Name of the GitLab resource.
            examples:
              - gitlab
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitLabResource"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabResource"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a GitLab resource
      tags:
        - gitlabs
  /api/v1/namespaces/{namespace}/gitlabs/{name}/siphon:
    delete:
      operationId: delete-siphon
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
        - description: Name of the GitLab resource.
          in: path
          name: name
          required: true
          schema:
            description: Name of the GitLab resource.
            examples:
              - gitlab
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the Siphon of a GitLab instance
      tags:
        - siphons
    get:
      operationId: get-siphon
      parameters:
        - description: Namespace of the GitLab resource.
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the GitLab resource.
            examples:
              - gitlab-system
            type: string
        - description: Name of the GitLab resource.
          in: path
          name: name
          required: true
